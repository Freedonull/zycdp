[package]
name = "zycdp"
version = "0.2.4"
rust-version = "1.85"
autotests = false
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Undetectable browser automation library"
authors = ["ccheshirecat"]
repository = "https://github.com/Freedonull/zycdp"
keywords = ["chrome", "chromedriver", "puppeteer", "automation", "stealth"]
categories = ["web-programming", "api-bindings", "development-tools::testing"]

[dependencies]
async-tungstenite = { version = "0.32", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
futures = "0.3"
chromiumoxide_types = { path = "chromiumoxide_types", version = "0.9" }
chromiumoxide_cdp = { path = "chromiumoxide_cdp", version = "0.9" }
chromiumoxide_fetcher = { path = "chromiumoxide_fetcher", version = "0.9", default-features = false, optional = true }
serde_json = "1"
which = "8"
thiserror = "2"
url = "2"
base64 = "0.22"
fnv = "1"
futures-timer = "3"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "time",
  "fs",
  "macros",
  "process",
] }
tracing = "0.1"
pin-project-lite = "0.2"
dunce = "1"
bytes = { version = "1", features = ["serde"], optional = true }
reqwest = { version = "0.13", default-features = false }
dashmap = "6"
rand = "0.8"
anyhow = "1"
# SOCKS5→HTTP 桥接（可选 feature `socks5-bridge`）。
# 本地起一个 HTTP CONNECT 转发器，代为完成到上游 SOCKS5（带认证）的握手，
# 让不支持 SOCKS5 认证的 Chrome 也能用带账号密码的 SOCKS5 代理。
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio-socks = { version = "0.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# 仅用于 Windows 真实物理内存探测（GlobalMemoryStatusEx）。
# 选 0.52 是传递依赖里已存在的版本，避免引入新的 windows-sys 大版本。
# `Win32_System_SystemInformation` 提供 GlobalMemoryStatusEx / MEMORYSTATUSEX，
# `Win32_Foundation` 提供 BOOL。
windows-sys = { version = "0.52", features = [
  "Win32_System_SystemInformation",
  "Win32_Foundation",
] }

[dev-dependencies]
quote = "1"
proc-macro2 = "1"
chrono = "0.4.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[features]
default = ["bytes"]
fetcher = ["chromiumoxide_fetcher"]
bytes = ["dep:bytes"]
# 启用 SOCKS5→HTTP 桥接（Socks5Bridge 组件）。
socks5-bridge = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio-socks"]

rustls = ["chromiumoxide_fetcher/rustls"]
native-tls = ["chromiumoxide_fetcher/native-tls"]

zip0 = ["chromiumoxide_fetcher/zip0"]
zip8 = ["chromiumoxide_fetcher/zip8"]

[[example]]
name = "fetcher"
required-features = ["fetcher", "zip8", "rustls"]

[[example]]
name = "socks5_bridge"
required-features = ["socks5-bridge"]

[[test]]
name = "chromiumoxide_tests"
path = "tests/lib.rs"
harness = true

[workspace]
members = [
  "chromiumoxide_pdl",
  "chromiumoxide_types",
  "chromiumoxide_cdp",
  "chromiumoxide_fetcher",
]
